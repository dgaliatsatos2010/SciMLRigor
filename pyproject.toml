[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scimlrigor"
version = "1.5.2"
description = "Counterfactual methodological stress testing and failure-injection benchmarking for machine-learning research."
readme = "README.md"
keywords = [
  "machine learning",
  "model evaluation",
  "cross-validation",
  "data leakage",
  "reproducibility",
  "transportability"
]
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Dimitrios Galiatsatos", email = "galiatsatos.dimitrios@ac.eap.gr"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
paper = [
  "scipy>=1.10",
  "matplotlib>=3.7",
  "statsmodels>=0.14"
]
benchmark = [
  "scipy>=1.10",
  "matplotlib>=3.7",
  "openpyxl>=3.1"
]
dev = [
  "pytest>=7",
  "pytest-cov>=4"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
scimlrigor = "scimlrigor.cli:main"
